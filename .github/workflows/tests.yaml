name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio
      - name: Run tests
        run: python -m pytest -q --ignore=tests/test_home_assistant_runtime.py
      - name: Compile integration
        run: python -m compileall -q custom_components/casambi_bt

  home-assistant-runtime:
    name: Home Assistant 2026.9 runtime (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant and manifest dependency
        shell: bash
        run: |
          requirement="$(python -c 'import json; print(json.load(open("custom_components/casambi_bt/manifest.json"))["requirements"][0])')"
          python -m pip install \
            pytest \
            pytest-asyncio \
            "homeassistant==2026.9.0" \
            "aiousbwatcher==1.1.2" \
            "serialx==1.9.0" \
            "aiohasupervisor==0.6.0" \
            "$requirement"
      - name: Smoke-test real integration imports
        run: python -m pytest -q tests/test_home_assistant_runtime.py
